<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TA Lab">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f4c81">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>TechAssures Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FCFCFA;--wash:#F7F7F4;--surface:#FFFFFF;--ink:#121413;--ink2:#1D201E;
  --g1:#4C4F4D;--g2:#848784;--g3:#B9BBB7;--line:#E4E4DF;
  --acc:#1F4E79;--acc-ink:#1F4E79;--acc-soft:rgba(31,78,121,.11);
  --warn:#A8530A;--warn-soft:rgba(168,83,10,.12);--bad:#B3261E;--bad-soft:rgba(179,38,30,.10);
  --hdr:#121413;--shadow:0 1px 2px rgba(18,20,19,.06),0 4px 14px rgba(18,20,19,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0E100F;--wash:#141716;--surface:#1A1D1B;--ink:#F3F4F0;--ink2:#E4E6E1;
    --g1:#B4B7B2;--g2:#8A8D89;--g3:#555855;--line:#2B2F2C;
    --acc:#6FA8DC;--acc-ink:#2F6AA5;--acc-soft:rgba(111,168,220,.18);
    --warn:#E0883A;--warn-soft:rgba(224,136,58,.16);--bad:#F2766E;--bad-soft:rgba(242,118,110,.14);
    --hdr:#0A0B0A;--shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font:16px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--paper);color:var(--ink);overflow-x:hidden;min-width:0;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4,.hd{font-family:Manrope,Inter,system-ui,sans-serif;letter-spacing:-.01em;color:var(--ink)}
h1{font-size:24px;font-weight:800;line-height:1.2}
h2{font-size:19px;font-weight:700}
h3{font-size:16px;font-weight:700}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:.92em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.vh{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden;pointer-events:none}
.mut{color:var(--g1)} .sm{font-size:13px} .xs{font-size:12px}
.nw{white-space:nowrap}
.grow{flex:1;min-width:0}
.ic{flex:none;display:block}

/* header */
.hdr{position:sticky;top:0;z-index:30;background:var(--hdr);color:#fff;border-bottom:3px solid var(--acc);min-height:60px;display:flex;align-items:center;gap:8px;padding:0 6px 0 16px}
.brand{font-family:Manrope,sans-serif;font-weight:800;font-size:17px;white-space:nowrap;color:#fff;display:flex;align-items:center;gap:8px}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--acc);display:inline-block}
.who{margin-left:auto;font-size:13px;color:#D9DBD7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hbtn{min-width:48px;min-height:48px;display:flex;align-items:center;justify-content:center;color:#fff;border-radius:10px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2f7bd8;margin-right:4px}
.hbtn{position:relative}
.nbadge{position:absolute;top:6px;right:5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#e5484d;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.hbtn:active{background:rgba(255,255,255,.1)}

/* layout */
.side{display:none}
.main{padding:18px 16px 110px;max-width:720px;margin:0 auto;width:100%}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.bnav button{flex:1;min-width:0;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--g1);position:relative;text-align:center}
.bnav button.on{color:var(--ink);font-weight:600}
.bnav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--acc);border-radius:0 0 3px 3px}
.bnav button.on .ic{color:var(--acc)}
@media (min-width:900px){
  .bnav{display:none}
  .side{display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;width:236px;background:#121413;color:#D9DBD7;z-index:40;padding:18px 12px;border-right:3px solid var(--acc)}
  .side .brand{padding:6px 10px 20px;font-size:19px}
  .side button.nv{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;border-radius:10px;color:#C8CAC6;font-weight:500;width:100%}
  .side button.nv:hover{background:rgba(255,255,255,.07)}
  .side button.nv.on{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 3px 0 0 var(--acc)}
  .side .sp{flex:1}
  .col{margin-left:236px}
  .col .hdr .brand{display:none}
  .col .hdr{padding-left:24px}
  .main{padding-bottom:48px}
}

/* cards & lists */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.sec{margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec h2{font-size:17px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;text-align:left}
.row:active{background:var(--wash)}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--g1);overflow-wrap:anywhere}
.empty{padding:26px 14px;text-align:center;color:var(--g1);border:1px dashed var(--g3);border-radius:12px;font-size:14px}
.pg{display:flex;align-items:center;gap:6px;margin-bottom:14px}
.pg h1{font-size:22px;flex:1;min-width:0;overflow-wrap:anywhere}
.ibtn{min-width:48px;min-height:48px;display:flex;align-items:center;justify-content:center;border-radius:12px;margin-left:-10px}
.ibtn:active{background:var(--wash)}

/* buttons */
.btn{min-height:48px;padding:0 20px;border-radius:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);text-align:center;font-family:Inter,sans-serif}
.btn:active{filter:brightness(.96)}
.btn.pri{background:var(--acc-ink);border-color:var(--acc-ink);color:#fff}
.btn.dng{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.blk{display:flex;width:100%}
.btn.sm{min-height:48px;padding:0 14px;font-size:14px}
.btn[disabled],.btn.off{opacity:.45;pointer-events:none}
.lnk{color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:600;min-height:48px;display:inline-flex;align-items:center;padding:0 6px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .btn{flex:1;min-width:140px}

/* forms */
.fld{margin-bottom:16px;min-width:0}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--g1);margin-bottom:6px}
.in{width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;appearance:none;-webkit-appearance:none}
select.in{background-image:linear-gradient(45deg,transparent 50%,var(--g1) 50%),linear-gradient(135deg,var(--g1) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.in:focus{border-color:var(--acc)}
.in.bad{border-color:var(--bad)}
.in[disabled],.in[readonly]{background:var(--wash);color:var(--g1)}
textarea.in{min-height:84px;resize:vertical}
.err{color:var(--bad);font-size:13px;margin-top:5px;font-weight:500}
.hint{color:var(--g1);font-size:13px;margin-top:5px}
.note{background:var(--warn-soft);color:var(--ink);border-left:3px solid var(--warn);padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:14px}
.note.bad{background:var(--bad-soft);border-color:var(--bad)}
.note.ok{background:var(--acc-soft);border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:6px 16px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font-weight:500;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.2}
.chip small{font-size:11px;color:var(--g1);font-weight:400}
.chip.on{border-color:var(--acc);background:var(--acc-soft);font-weight:600}
.chip.lg{border-radius:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two>*{min-width:0}
.step{display:flex;align-items:center;gap:6px}
.step button{width:48px;height:48px;border-radius:12px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;background:var(--surface)}
.step b{min-width:40px;text-align:center;font-size:18px;font-family:Manrope,sans-serif}
.dims{display:flex;align-items:center;gap:6px}
.dims .in{padding:10px 6px;text-align:center}
.dims span{color:var(--g1)}

/* tabs */
.tabs{display:flex;gap:2px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tabs button{min-height:48px;padding:6px 6px;font-weight:600;font-size:14px;line-height:1.2;color:var(--g1);border-bottom:3px solid transparent;margin-bottom:-1px;flex:1 1 0;min-width:0;text-align:center;overflow-wrap:anywhere}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc)}

/* badges */
.bd{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--wash);color:var(--g1);border:1px solid var(--line);white-space:nowrap}
.bd.ok{background:var(--acc-soft);color:var(--ink);border-color:transparent}
.bd.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.bd.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.bd.dark{background:#121413;color:#fff;border-color:transparent}

/* dashboard */
.greet{margin-bottom:16px}
.greet p{color:var(--g1);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 10px;min-height:84px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.stat b{font-family:Manrope,sans-serif;font-size:22px;font-weight:800;line-height:1.1;overflow-wrap:anywhere}
.stat span{font-size:12px;color:var(--g1);line-height:1.2}
.stat.hot{border-color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:92px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;font-size:13px;font-weight:600;min-width:0}
.mod:active{background:var(--wash)}
.mod .ic{color:var(--ink)}

/* wizard */
.wz{min-height:100vh;background:var(--paper)}
.wz .hdr{padding-left:6px}
.wz .ttl{font-family:Manrope,sans-serif;font-weight:700;font-size:16px}
.wzin{max-width:720px;margin:0 auto;padding:16px 16px 120px}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .2s}
.strip{background:#121413;color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:16px;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px}
.strip small{display:block;color:#A9ACA8;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.strip .full{grid-column:1/-1}
.sbar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.sbar>div{max-width:720px;margin:0 auto;display:flex;gap:10px}
.sbar .btn{flex:1}
.selblk{display:flex;gap:12px;align-items:flex-start;background:var(--wash);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.selblk .t{font-weight:700}
.szrow{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--wash)}
.szrow .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.photo{width:100%;max-height:220px;object-fit:cover;border-radius:12px;border:1px solid var(--line);margin-top:10px}
canvas.sig{width:100%;height:150px;border:1.5px dashed var(--g3);border-radius:10px;background:#fff;touch-action:none;display:block}
.sumhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.dl{display:grid;grid-template-columns:minmax(90px,36%) 1fr;gap:6px 12px;font-size:14px}
.dl dt{color:var(--g1)} .dl dd{overflow-wrap:anywhere;min-width:0}

/* tables */
table.tb{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
table.tb th{text-align:left;font-weight:600;color:var(--g1);padding:6px 4px;border-bottom:1px solid var(--line);font-size:12px}
table.tb td{padding:9px 4px;border-bottom:1px solid var(--line);overflow-wrap:anywhere;vertical-align:top}
table.tb .r{text-align:right}
table.tb tr.tot td{font-weight:700;border-bottom:0}

/* report */
.rpt{background:var(--surface);border:1px solid var(--g3);border-radius:6px;padding:18px 16px;font-size:14px}
.rpt .rh{display:flex;justify-content:space-between;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:12px;flex-wrap:wrap}
.rpt h3{margin:14px 0 6px;font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--g1)}
.rpt .ft{margin-top:14px;font-size:12px;color:var(--g1);border-top:1px solid var(--line);padding-top:10px}

/* misc */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;max-width:min(92vw,420px);background:#121413;color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s;border-left:3px solid var(--acc)}
.toast.show{opacity:1}
.toast.bad{border-left-color:var(--bad)}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
@media (min-width:900px){.sheetbg{align-items:center}.sheet{border-radius:18px}}
.login{max-width:420px;margin:0 auto;padding:36px 20px}
.login .logo{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.login .logo i{width:12px;height:12px;border-radius:50%;background:var(--acc)}
.pgn{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.pgn:last-child{border-bottom:0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px}
.kv b{text-align:right;overflow-wrap:anywhere}
.big{font-family:Manrope,sans-serif;font-weight:800;font-size:20px}
.done{text-align:center;padding:10px 0 4px}
.done .tick{width:60px;height:60px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.search{position:relative;margin-bottom:12px}
.search .in{padding-left:42px}
.search .ic{position:absolute;left:12px;top:13px;color:var(--g2)}
.chkb{min-width:48px;min-height:48px;margin:-12px 0 -12px -10px;display:flex;align-items:center;justify-content:center;flex:none}
.chkb::before{content:"";width:26px;height:26px;border-radius:50%;border:2px solid var(--g3);background:var(--surface);position:absolute}
.chkb{position:relative}
.chkb .ic{position:relative;z-index:1;color:#fff}
.chkb.on::before{background:var(--acc-ink);border-color:var(--acc-ink)}
.hbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--acc);border-radius:4px}
@media (max-width:380px){.brand span.l{display:none}.stat b{font-size:19px}}

/* review flow */
.cal{padding:12px}.calh{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.cdw,.cdg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cdw span{font-size:12px;color:var(--g1);font-weight:600;padding:4px 0}
.cdg i{display:block}
.cd{position:relative;min-height:44px;border-radius:10px;font-weight:600;color:var(--ink);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;background:transparent}
.cd.past{color:var(--g2)}.cd.today{box-shadow:inset 0 0 0 2px var(--acc-ink)}
.cd.sel{background:var(--ink);color:var(--surface)}
.cd b{font-size:11px;min-width:18px;height:18px;border-radius:9px;background:var(--acc-ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;padding:0 4px}
.cd b.od{background:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--g1)}
.ld{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--acc-ink);margin-right:4px}.ld.od{background:var(--bad)}.ld.ring{background:transparent;box-shadow:inset 0 0 0 2px var(--acc-ink)}
.stepn{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--acc-soft);color:var(--acc-ink);font-size:13px;align-items:center;justify-content:center;margin-right:8px}
.rpwrap{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
.rpwrap .rpt{font-size:12px;border:0}
.rt{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:6px}.rt th,.rt td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top;overflow-wrap:anywhere}.rt th{background:var(--wash);font-weight:600;color:var(--g1);width:22%}
.rtag{font-size:11px;border:1px solid var(--warn);color:var(--warn);border-radius:4px;padding:1px 6px;white-space:nowrap}.rtag.fin{border-color:var(--acc-ink);color:var(--acc-ink)}
.tbs{overflow-x:auto}.stmt{background:var(--acc-soft);border:1px solid var(--line);padding:8px;border-radius:6px;font-size:12px}
.rem{padding-left:18px;font-size:12px}
.qrv{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:10px;border-top:1px dashed var(--g3);font-size:11px}.qrv svg{width:84px;height:84px;flex:none}.sigs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;font-size:12px}.sigs .sl{border-bottom:1px solid var(--g3);height:34px;margin-bottom:4px}.sg{font-family:cursive;font-size:18px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:8px}
.sw b{display:block}.sw span{display:block;font-size:13px;color:var(--g1)}.sw i{width:46px;height:26px;border-radius:13px;background:var(--g3);position:relative;flex:none}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}.sw.on{border-color:var(--acc-ink)}.sw.on i{background:var(--acc-ink)}.sw.on i::after{left:23px}
.cbx{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:14px 4px;margin:6px 0}.cbx i{width:26px;height:26px;border-radius:6px;border:2px solid var(--g2);flex:none;display:flex;align-items:center;justify-content:center;color:#fff}.cbx.on i{background:var(--acc-ink);border-color:var(--acc-ink)}

 const rate=rateFor(db,c,t),qty=qtyOf(s,t),sub=r2(rate*qty),gp=num(db.settings.gst);const gstPct=isNaN(gp)?18:gp;
 const gst=r2(sub*gstPct/100);
 const no=forcedNo!=null?forcedNo:db.counters.inv++;
 const due=s.billing==='Advance'?s.receipt:addDays(s.receipt,parseInt(c.creditDays,10)||parseInt(db.settings.creditDays,10)||30);
 const inv={id:'i'+s.id.slice(1),no:'INV-'+yy()+'-'+pad(no,4),sampleId:s.id,clientId:c.id,date:s.receipt,due:due,lines:[{desc:t.name+' ('+t.code+')',qty:qty,unit:t.unit,rate:rate,amount:sub}],subtotal:sub,gstPct:gstPct,gst:gst,total:r2(sub+gst)};
 db.invoices.push(inv);s.invoiceId=inv.id;return inv;
}

function upsertLocal(c,rec,markSynced){
 const arr=S.db[c],i=arr.findIndex(x=>x.id===rec.id);
 if(i>=0)arr[i]=rec;else arr.push(rec);
 if(markSynced&&SYNC.indexOf(c)>=0)S.synced[c][rec.id]=JSON.stringify(rec);
}
function applyChanges(ch){
 let changed=false;const up=ch.upserts||{},dl=ch.deletes||{};
 Object.keys(up).forEach(c=>{
  if(c==='settings'){if(S.user.role==='admin'&&S.synced.settings!==JSON.stringify(S.db.settings))return;S.db.settings=up.settings;S.synced.settings=JSON.stringify(up.settings);changed=true;return}
  if(!S.db[c])return;
  up[c].forEach(rec=>{
   const arr=S.db[c],i=arr.findIndex(x=>x.id===rec.id),js=JSON.stringify(rec);
   if(SYNC.indexOf(c)>=0&&i>=0&&S.synced[c][rec.id]!==JSON.stringify(arr[i]))return;   /* unsaved local edit wins */
   if(i>=0){if(JSON.stringify(arr[i])!==js){arr[i]=rec;changed=true}}else{arr.push(rec);changed=true}
   if(SYNC.indexOf(c)>=0)S.synced[c][rec.id]=js;
  });
 });
 Object.keys(dl).forEach(c=>{if(!S.db[c])return;dl[c].forEach(id=>{const i=S.db[c].findIndex(x=>x.id===id);if(i>=0){S.db[c].splice(i,1);changed=true}})});
 if(ch.counters&&ch.counters.uid)S.db.counters=Object.assign(S.db.counters,ch.counters);
 S.rev=ch.rev;return changed;
}
/* push edits made through the bound fields (clients, projects, tests, CRM, settings) */
let pushing=false,pushAgain=false;const lastErr={};
async function pushDirty(){
 if(!S.online||!S.user)return;
 if(pushing){pushAgain=true;return}
 pushing=true;
 try{
  for(const c of SYNC){
   for(const rec of (S.db[c]||[]).slice()){
    const js=JSON.stringify(rec);
    if(S.synced[c][rec.id]===js)continue;
    try{await api('PUT','/api/'+c+'/'+rec.id,rec);S.synced[c][rec.id]=js;delete lastErr[c+rec.id]}
    catch(e){if(e.status===401)return;if(lastErr[c+rec.id]!==e.message){lastErr[c+rec.id]=e.message;toast('Not saved: '+e.message,1)}}
   }
  }
  if(S.user.role==='admin'){
   const js=JSON.stringify(S.db.settings);
   if(S.synced.settings!==js){try{await api('PUT','/api/settings/main',Object.assign({id:'main'},S.db.settings));S.synced.settings=js}catch(e){if(e.status!==401&&lastErr.settings!==e.message){lastErr.settings=e.message;toast('Not saved: '+e.message,1)}}}
  }
 }finally{pushing=false;if(pushAgain){pushAgain=false;pushDirty()}}
}

const LNP=()=>{try{return window.Capacitor.registerPlugin('LocalNotifications')}catch(e){return null}};
const nhash=str=>{let h=7;for(let i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))>>>0;return (h%2000000000)+1};
function alertPerm(){if(isNative())return S.alertState||'unknown';return window.Notification?Notification.permission:'unsupported'}
/* ask for everything the Android app needs: alerts, location, camera, photos */
const firstPerms=()=>{if(isNative()&&!lsGet('ta_perms_asked'))setTimeout(askAllPerms,600)};
async function askAllPerms(){
 if(!isNative())return;
 const reg=n=>{try{return window.Capacitor.registerPlugin(n)}catch(e){return null}};
 try{const ln=LNP();if(ln){const r=await ln.requestPermissions();S.alertState=r.display==='granted'?'granted':'denied'}}catch(e){}
 try{const g=reg('Geolocation');if(g)await g.requestPermissions({permissions:['location']})}catch(e){}
 try{const c=reg('Camera');if(c)await c.requestPermissions({permissions:['camera','photos']})}catch(e){}
 if(S.alertState==='granted')scheduleLocal();
 lsSet('ta_perms_asked','1');render();
}
const pushOK=()=>!isNative()&&'serviceWorker' in navigator&&'PushManager' in window&&window.isSecureContext;
async function ensurePush(){
 if(!pushOK()||!S.online||!S.user||!window.Notification||Notification.permission!=='granted')return;
 try{
  const reg=await navigator.serviceWorker.register('/sw.js');await navigator.serviceWorker.ready;
  const k=await api('GET','/api/push/key');
  let sub=await reg.pushManager.getSubscription();
  if(!sub){const raw=atob(k.key.replace(/-/g,'+').replace(/_/g,'/'));const arr=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);
   sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:arr})}
  await api('POST','/api/push/subscribe',{sub:sub.toJSON()});
 }catch(e){}
}
async function ensureNativePush(){
 if(!isNative()||!S.online||!S.user)return;
 try{
  const P=window.Capacitor.registerPlugin('PushNotifications');
  const pr=await P.checkPermissions();if(pr.receive!=='granted'){const r=await P.requestPermissions();if(r.receive!=='granted')return}
  if(!window.__fcmL){window.__fcmL=1;
   await P.addListener('registration',t=>{api('POST','/api/push/subscribe',{sub:{fcm:t.value}}).catch(()=>{})});
   await P.addListener('pushNotificationActionPerformed',()=>{try{checkAlerts(true)}catch(e){}})}
  await P.register();
 }catch(e){}
}
async function enableAlerts(){
 try{
  if(isNative()){await askAllPerms();ensureNativePush();return}
  else if(window.Notification){await Notification.requestPermission();await ensurePush()}
 }catch(e){}
 render();
}

async function recordPay(){
 if(S.busy)return;
 const m=M('bills'),i=D().invoices.find(x=>x.id===m.invId),pf=m.pay,e={},bal=balOf(i),a=num(pf.amount);
 if(!(a>0))e.amount='Enter an amount greater than 0';else if(r2(a)>bal)e.amount='Amount is more than the balance of '+inr(bal);
 if(!pf.date)e.date='Choose the payment date';
 if(Object.keys(e).length){pf.err=e;render();return}
 S.busy=true;const geo=await tryLoc();S.busy=false;
 const body={amount:r2(a),date:pf.date,mode:pf.mode,ref:(pf.ref||'').trim(),geo:geo};
 if(S.online){
  S.busy=true;render();
  try{const r=await api('POST','/api/invoices/'+i.id+'/payments',body);upsertLocal('payments',r.payment)}
  catch(er){S.busy=false;pf.err={amount:er.message};render();return}
  S.busy=false;
 }else{D().payments.push(Object.assign({id:'pay'+rid(),invoiceId:i.id},body));persistNow()}
 m.pay=null;toast('Payment of '+inr(r2(a))+' recorded');render();
}

/* signature canvas */
let drawing=null,last=null;
function cpt(e,c){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}
document.addEventListener('pointerdown',e=>{
 const c=e.target.closest&&e.target.closest('canvas.sig');if(!c)return;
 e.preventDefault();drawing=c;last=cpt(e,c);try{c.setPointerCapture(e.pointerId)}catch(x){}
 const x=c.getContext('2d');x.fillStyle='#121413';x.beginPath();x.arc(last.x,last.y,2.2,0,6.3);x.fill();
});
document.addEventListener('pointermove',e=>{
 if(!drawing)return;const c=drawing,p=cpt(e,c),x=c.getContext('2d');
 x.strokeStyle='#121413';x.lineWidth=3.6;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(last.x,last.y);x.lineTo(p.x,p.y);x.stroke();last=p;
});
function endDraw(){
 if(!drawing)return;const c=drawing;drawing=null;
 if(S.wiz){S.wiz.f.sig=c.toDataURL('image/png');if(S.wiz.err)delete S.wiz.err.sig;const er=appEl.querySelector('canvas.sig+.err');if(er)er.remove()}
}
document.addEventListener('pointerup',endDraw);
document.addEventListener('pointercancel',endDraw);

  const c={id:'c'+rid(),code:n.code.trim(),name:n.name.trim(),address:n.address.trim(),gst:n.gst.trim().toUpperCase(),terms:n.terms,creditDays:n.terms==='Credit'?String(n.creditDays):'0',contact:n.contact.trim(),phone:n.phone.trim(),rates:{}};
  if(!(await createRec('clients',c)))return;
  m.adding=false;m.clientId=c.id;m.tab='overview';toast('Client added');render();window.scrollTo(0,0)},
 /* admin */
 admtab(t){const m=M('admin');m.tab=t.dataset.v;if((m.tab==='activity'||m.tab==='signins')&&S.online){m.audit=null;render();loadAudit();return}render()},
 async touser(t){const id=t.dataset.id,u=us(id);if(id===S.user.id){toast('You cannot disable your own account',1);return}
  if(S.online){try{upsertLocal('users',await api('PUT','/api/users/'+id,{active:!u.active}))}catch(x){toast(x.message,1);return}}
  else{u.active=!u.active;persistNow()}
  toast(us(id).name+(us(id).active?' enabled':' disabled'));render()},
 async adduser(){const m=M('admin'),n=m.nu,er={};
  if(!n.name.trim())er.name='Enter the full name';
  const em=(n.email||'').trim();
  if(S.online&&em){if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))er.email='Enter a valid email'}
  if(!(S.online&&em&&!n.login.trim()&&!n.pin)){
   if(!n.login.trim())er.login='Enter a login name';else if(!S.online&&D().users.some(u=>u.login===n.login.trim().toLowerCase()))er.login='This login name is taken';
   if(!/^\d{4}$/.test(n.pin))er.pin='PIN must be 4 digits';
  }
  if(Object.keys(er).length){n.err=er;render();return}
  const body={name:n.name.trim(),login:n.login.trim().toLowerCase(),pin:n.pin,role:n.role,email:(n.email||'').trim()};
  if(S.online){try{upsertLocal('users',await api('POST','/api/users',body))}catch(x){n.err={login:x.message};render();return}}
  else{D().users.push({id:'u_'+rid(),login:body.login,pin:body.pin,name:body.name,role:body.role,active:true});persistNow()}
  m.nu={name:'',email:'',login:'',pin:'',role:'tester',err:{}};toast('User added');render()},
 nabl(t){const x=ts(t.dataset.id);x.nabl=!x.nabl;persist();render()},
 addtest(){D().tests.push({id:'t_'+rid(),name:'New test',code:'',rate:'0',nabl:false,kind:'simple',unit:'sample',ru:'value'});persistNow();render();toast('Test added — fill in the details')},
 reset(){S.confirm={title:'Reset demo data?',msg:'This restores the original clients, samples, bills and users. Anything you added or changed will be lost.',label:'Reset everything',act:'resetdo'};render()},
 csv(t){downloadCsv(t.dataset.v)},
 /* CRM */
 crmtab(t){M('crm').tab=t.dataset.v;render()},
 openlead(t){const m=M('crm');m.leadId=t.dataset.id;m.ni=null;m.nt=null;render();window.scrollTo(0,0)},
 leadback(){M('crm').leadId=null;render();window.scrollTo(0,0)},
 addlead(){const m=M('crm');m.adding=true;m.nl={name:'',contact:'',phone:'',source:'Referral',value:'',nextFollowUp:addDays(today(),2),notes:'',err:{}};render();window.scrollTo(0,0)},
 leadcancel(){M('crm').adding=false;render();window.scrollTo(0,0)},
 async savelead(){const m=M('crm'),n=m.nl,er={};
  if(!n.name.trim())er.name='Enter the company or person';
  if(n.phone.trim()&&!/^\d{10}$/.test(n.phone.trim()))er.phone='Phone should be 10 digits';
  if(String(n.value).trim()!==''&&!(num(n.value)>=0))er.value='Enter a number';
  if(Object.keys(er).length){n.err=er;render();toast('Please fix the highlighted fields',1);return}
  const T=today(),l={id:'l_'+rid(),name:n.name.trim(),contact:n.contact.trim(),phone:n.phone.trim(),email:'',source:n.source,stage:'new',value:num(n.value)||0,nextFollowUp:n.nextFollowUp||'',owner:S.user.id,notes:n.notes.trim(),lostReason:'',clientId:'',createdOn:T,updatedOn:T};
  const saved=await createRec('leads',l);if(!saved)return;
  m.adding=false;m.leadId=saved.id;m.ni=null;m.nt=null;toast('Lead added');render();window.scrollTo(0,0)},
 stage(t){const l=D().leads.find(x=>x.id===M('crm').leadId);if(!l)return;const v=t.dataset.v;l.stage=v;l.updatedOn=today();if(v!=='lost')l.lostReason='';if(v==='won'||v==='lost')l.nextFollowUp='';persist();render()},
 async convert(){const m=M('crm'),l=D().leads.find(x=>x.id===m.leadId);if(!l||l.clientId)return;
  let n=D().clients.length+1,code;const base=(l.name.replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()||'CL');
  do{code=base+'-'+pad(n++,3)}while(D().clients.some(c=>c.code===code));
  const c={id:'c'+rid(),code:code,name:l.name,address:'',gst:'',terms:'Credit',creditDays:String(D().settings.creditDays||30),contact:l.contact,phone:l.phone,rates:{}};
  if(!(await createRec('clients',c)))return;
  l.clientId=c.id;l.stage='won';l.updatedOn=today();persist();toast('Client created — add the address and projects');go('clients',{clientId:c.id,tab:'overview'})},
 async addint(t){const mk=t.dataset.mk,m=M(mk),n=m.ni;
  if(!n.summary.trim()){n.err='Write a short note';render();return}
  const rec={id:'n_'+rid(),clientId:mk==='clients'?m.clientId:'',leadId:mk==='crm'?m.leadId:'',type:n.type,summary:n.summary.trim(),date:n.date||today(),by:S.user.id};
  if(!(await createRec('interactions',rec)))return;
  m.ni=null;toast('Activity saved');render()},
 async addtask(t){const mk=t.dataset.mk,m=M(mk),n=m.nt;
  if(!n.title.trim()){n.err='Enter the task';render();return}
  let clientId='',leadId='';
  if(t.dataset.global){const lk=n.link||'';if(lk.indexOf('c:')===0)clientId=lk.slice(2);else if(lk.indexOf('l:')===0)leadId=lk.slice(2)}
  else{clientId=mk==='clients'?m.clientId:'';leadId=mk==='crm'?m.leadId:''}
  const rec={id:'k_'+rid(),title:n.title.trim(),due:n.due||today(),done:false,doneOn:'',assignee:S.user.id,clientId:clientId,leadId:leadId};
  if(!(await createRec('tasks',rec)))return;
  m.nt=null;toast('Follow-up added');render()},
 tasktoggle(t){const k=D().tasks.find(x=>x.id===t.dataset.id);if(!k)return;k.done=!k.done;k.doneOn=k.done?today():'';persist();render()},
 opencrmclient(t){go('clients',{clientId:t.dataset.id,tab:canMoney()?'crm':'overview'})},
 delrec(t){const lbl={leads:'lead',interactions:'activity note',tasks:'follow-up',vendorbills:'vendor bill',quotes:'quotation',workorders:'work order'}[t.dataset.c]||'record';S.pendingDel={c:t.dataset.c,id:t.dataset.id};S.confirm={title:'Delete this '+lbl+'?',msg:'This cannot be undone.',label:'Delete',act:'delrecdo'};render()},
 cno(){S.confirm=null;render()},
 cyes(){const a=S.confirm&&S.confirm.act;S.confirm=null;if(a&&CONF[a])CONF[a]();render();window.scrollTo(0,0)}
};
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act],[data-go]');if(!t)return;
 if(t.classList.contains('sheetbg')&&e.target!==t)return;
 if(t.dataset.go){let set=null;try{set=t.dataset.set?JSON.parse(t.dataset.set):null}catch(x){}go(t.dataset.go,set);return}
 const f=ACT[t.dataset.act];if(f)f(t,e);
});
window.addEventListener('beforeunload',()=>{if(S.db&&!S.booting)persistNow()});
render();
boot();
})();
</script>
</body>
</html>
