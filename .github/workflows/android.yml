name: Build Android app
on:
  workflow_dispatch:
  push:
    paths: ['mobile/**', '.github/workflows/android.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install and sync
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android
      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then echo "Add the ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD secrets first (see mobile/README.md)"; exit 1; fi
          echo "$KS_B64" | base64 -d > release.keystore
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -p -f 4 "$UNSIGNED" aligned.apk
          $BT/apksigner sign --ks release.keystore --ks-key-alias techassures --ks-pass env:KS_PASS --key-pass env:KS_PASS --out TechAssures-Lab.apk aligned.apk
          $BT/apksigner verify TechAssures-Lab.apk
          rm release.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: TechAssures-Lab-apk
          path: TechAssures-Lab.apk
